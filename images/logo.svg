<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Friendzone Campfire">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1a3d"/>
      <stop offset="1" stop-color="#17110a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#ff9a45" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#ff6a2a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff6a2a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect x="6" y="6" width="228" height="228" rx="52"/></clipPath>
  </defs>

  <rect x="6" y="6" width="228" height="228" rx="52" fill="url(#bg)"/>

  <g clip-path="url(#card)">
  <!-- night sparks -->
  <circle cx="52" cy="46" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="198" cy="58" r="2.6" fill="#fff" opacity="0.45"/>
  <circle cx="150" cy="34" r="1.6" fill="#fff" opacity="0.55"/>
  <circle cx="74" cy="84" r="1.4" fill="#ffd9a8" opacity="0.5"/>

  <!-- warmth pool -->
  <circle cx="120" cy="150" r="96" fill="url(#glow)"/>

  <!-- friends gathered round -->
  <g fill="#ffe9d3" opacity="0.26">
    <circle cx="58" cy="206" r="6"/>
    <circle cx="89" cy="214" r="6"/>
    <circle cx="120" cy="217" r="6"/>
    <circle cx="151" cy="214" r="6"/>
    <circle cx="182" cy="206" r="6"/>
  </g>

  <!-- logs -->
  <g transform="rotate(-18 120 186)">
    <rect x="60" y="178" width="120" height="17" rx="8.5" fill="#3f2c1d"/>
    <circle cx="60" cy="186.5" r="8.5" fill="#6b4a2f"/>
    <circle cx="180" cy="186.5" r="8.5" fill="#54392639"/>
    <circle cx="180" cy="186.5" r="8.5" fill="#573c28"/>
  </g>
  <g transform="rotate(17 120 190)">
    <rect x="60" y="182" width="120" height="17" rx="8.5" fill="#4a3524"/>
    <circle cx="60" cy="190.5" r="8.5" fill="#5a3f2a"/>
    <circle cx="180" cy="190.5" r="8.5" fill="#6b4a2f"/>
  </g>

  <!-- flame -->
  <path d="M120 40 C 151 80, 151 96, 138 121 C 151 119, 157 108, 157 96 C 178 129, 169 172, 132 190 C 99 202, 64 181, 64 142 C 64 119, 77 103, 92 95 C 88 116, 105 122, 105 103 C 105 76, 108 58, 120 40 Z" fill="#ff5a1e"/>
  <path d="M120 72 C 141 100, 141 114, 133 130 C 143 126, 146 120, 146 111 C 160 138, 151 168, 124 180 C 100 188, 81 171, 81 147 C 81 131, 91 119, 101 113 C 99 130, 112 134, 112 118 C 112 100, 112 85, 120 72 Z" fill="#ff9e2c"/>
  <path d="M120 106 C 133 124, 133 134, 128 144 C 135 141, 137 137, 137 131 C 147 149, 140 167, 123 174 C 108 179, 97 167, 97 152 C 97 142, 103 134, 109 130 C 108 141, 117 143, 117 133 C 117 122, 116 113, 120 106 Z" fill="#ffe66b"/>
  <ellipse cx="119" cy="158" rx="7" ry="10" fill="#fff6d6"/>

  <!-- embers -->
  <circle cx="150" cy="86" r="3.2" fill="#ffb347"/>
  <circle cx="86" cy="70" r="2.6" fill="#ffcf7a"/>
  <circle cx="160" cy="120" r="2.4" fill="#ffcf7a"/>
  <circle cx="78" cy="118" r="2.2" fill="#ffb347"/>
  </g>
</svg>
